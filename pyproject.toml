[project]
name = "wallet-observer-development"
version = "0.0.0"
description = "Wallet Observer workspace and development tooling"
requires-python = ">=3.12,<3.13"
dependencies = ["wallet-observer"]

[dependency-groups]
dev = ["ruff==0.16.10", "pytest==9.1.1", "debugpy==1.8.22", "httpx2==2.13.1"]
qualification = ["websockets==17.0.1"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
wallet-observer = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/tooling", "backend/tests", "tests/integration"]
addopts = "-ra"
