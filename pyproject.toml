[project]
name = "wallet-observer-development"
version = "0.0.0"
description = "Development tooling for Wallet Observer; application follows in WO-003"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.10", "pytest==9.1.1", "debugpy==1.8.22"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/tooling"]
addopts = "-ra"
