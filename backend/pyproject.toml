[project]
name = "wallet-observer"
version = "0.1.0"
description = "Read-only wallet observer API and worker foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic-settings==2.15.0",
  "psycopg[binary]==3.3.6",
]

[project.scripts]
wallet-observer = "wallet_observer.__main__:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallet_observer"]
